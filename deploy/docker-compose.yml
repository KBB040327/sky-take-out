# ============================================================
# 苍穹外卖 —— 多容器编排
#   mysql  : 数据库（首次启动自动导入 sky.sql）
#   redis  : 缓存
#   app    : SpringBoot 应用
#   nginx  : 反向代理 + 静态页面（对外只暴露 80）
#
# 启动：docker compose up -d --build
# 查看：docker compose ps
# 日志：docker compose logs -f app
# 停止：docker compose down          （保留数据）
# 清空：docker compose down -v       （连数据一起删）
# ============================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: sky_take_out
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # ⚠️ 内存受限，调小缓冲池（默认 128M，这里给 192M）
      - --innodb-buffer-pool-size=192M
      - --max-connections=80
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - sky-net

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: sky-redis
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sky-net

  # ---------- 应用 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sky-take-out:1.0
    container_name: sky-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ⚠️ 关键：容器之间用【服务名】互访，不能用 localhost
      #    Spring Boot 里环境变量优先级高于 application.yml，所以能覆盖掉 localhost
      SKY_DATASOURCE_HOST: mysql
      SKY_DATASOURCE_PORT: "3306"
      SKY_DATASOURCE_DATABASE: sky_take_out
      SKY_DATASOURCE_USERNAME: root
      SKY_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SKY_REDIS_HOST: redis
      SKY_REDIS_PORT: "6379"
      SKY_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # 以下第三方能力在本地部署中用不到，留空即可（有默认值不会启动失败）
      ALIYUN_OSS_ENDPOINT: ""
      ALIYUN_OSS_ACCESS_KEY_ID: ""
      ALIYUN_OSS_ACCESS_KEY_SECRET: ""
      ALIYUN_OSS_BUCKET: ""
      WECHAT_APPID: ""
      WECHAT_SECRET: ""
      WECHAT_MCHID: ""
      WECHAT_MCH_SERIAL_NO: ""
      WECHAT_API_V3_KEY: ""
      WECHAT_NOTIFY_URL: ""
      WECHAT_REFUND_NOTIFY_URL: ""
    networks:
      - sky-net

  # ---------- Nginx ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: sky-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - sky-net

networks:
  sky-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
