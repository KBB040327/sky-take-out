# ============================================================
# Nginx 配置 —— 反向代理 + 静态资源
# ============================================================
server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/sky.access.log;
    error_log  /var/log/nginx/sky.error.log warn;

    # ---------- 静态首页 ----------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # ---------- 接口文档（Knife4j）----------
    location /doc.html {
        proxy_pass http://app:8080/doc.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 开放接口（用户端 /user/...）----------
    location /user/ {
        proxy_pass http://app:8080/user/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- 管理端接口（/admin/...）----------
    location /admin/ {
        proxy_pass http://app:8080/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- WebSocket（来单提醒 / 客户催单）----------
    # ⚠️ 必须加 Upgrade 和 Connection 头，否则 WebSocket 握手会失败
    location /ws/ {
        proxy_pass http://app:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Knife4j 的静态资源
    location /webjars/ {
        proxy_pass http://app:8080/webjars/;
        proxy_set_header Host $host;
    }
    location /v3/ {
        proxy_pass http://app:8080/v3/;
        proxy_set_header Host $host;
    }
}
