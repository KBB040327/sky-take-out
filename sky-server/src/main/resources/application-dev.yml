# ===================================================================
# 开发环境配置
#
# ⚠️ 所有敏感信息（密码、密钥）都通过【环境变量】注入，不写在本文件里。
#    这样做是为了避免把密钥提交到 Git 仓库。
#
# 使用方式：
#   Windows (PowerShell)
#     setx MYSQL_PASSWORD "你的MySQL密码"
#     setx REDIS_PASSWORD "你的Redis密码"
#     setx ALIYUN_OSS_ACCESS_KEY_ID "你的AccessKeyId"
#     setx ALIYUN_OSS_ACCESS_KEY_SECRET "你的AccessKeySecret"
#     （设置后需要重启 IDEA / 终端才会生效）
#
#   macOS / Linux
#     export MYSQL_PASSWORD="你的MySQL密码"
#     ...
#
# 完整的变量清单见 README.md「配置连接信息」一节。
# ===================================================================

sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: ${MYSQL_PASSWORD:}

  alioss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET:}

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}

  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    mchid: ${WECHAT_MCHID:}
    mchSerialNo: ${WECHAT_MCH_SERIAL_NO:}
#    privateKeyFilePath: D:\pay\apiclient_key.pem
    apiV3Key: ${WECHAT_API_V3_KEY:}
#    weChatPayCertFilePath: D:\pay\wechatpay_xxx.pem
    notifyUrl: ${WECHAT_NOTIFY_URL:}
    refundNotifyUrl: ${WECHAT_REFUND_NOTIFY_URL:}
